<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Simulador de Créditos</title>
  {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">

</head>
<body>
  <div class="container">
    <h2>Simulador de Créditos</h2>
        <form method="post" action="{% url 'logout' %}" style="text-align:right; margin-bottom:20px;">
        {% csrf_token %}
        <button type="submit" style="background:#d00000; color:white; padding:10px 15px; border:none; border-radius:8px; cursor:pointer;">
            🚪 Cerrar sesión
        </button>
    </form>
    
    <form id="simuladorForm" method="post">
        {% csrf_token %}
        <label for="monto">Monto</label>
        <input type="number" id="monto" name="monto" required>

        <label for="meses">Meses</label>
        <input type="number" id="meses" name="meses" required>

        <button type="submit">Simular</button>
    </form>

    <div id="resultado"></div>
  </div>

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.getElementById("simuladorForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const monto = document.getElementById("monto").value;
        const meses = document.getElementById("meses").value;

        try {
            const response = await fetch("/api/simular/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken") // 🔑 token CSRF
                },
                body: JSON.stringify({ monto, meses })
            });

            const data = await response.json();
            // Validar si hubo error
            if (data.error) {
                document.getElementById("resultado").innerHTML = `
                    <p style="color: red;">⚠️ ${data.error}</p>
                `;
                return;
            }

            // Construir salida 
            let html = `
                <div style="padding:15px; border:1px solid #ddd; border-radius:10px; background:#f9f9f9;">
                    <h3 style="color:#0077b6;">📊 Resultado de la Simulación</h3>
                    <p><strong>Monto:</strong> $${data.monto.toFixed(2)}</p>
                    <p><strong>Meses:</strong> ${data.meses}</p>
                    <hr>
            `;

            for (const [activo, valores] of Object.entries(data.resultados)) {
                html += `
                    <div style="margin:15px; padding:15px; border:1px solid #ccc; border-radius:10px; background:#ffffff;">
                        <h4 style="color:#023e8a;">${activo}</h4>
                        <p>💰 <strong>Esperado:</strong> $${valores.esperado}</p>
                        <p>📈 <strong>Mejor caso:</strong> $${valores.mejor}</p>
                        <p>📉 <strong>Peor caso:</strong> $${valores.peor}</p>
                        <hr>
                        <h3 style="color:#d00000;">🔎 Recomendación</h3>
                        <p>${valores.recomendacion}</p>
                    </div>
                `;
            }
            html += "</div>";
            document.getElementById("resultado").innerHTML = html;


        } catch (error) {
            console.error("Error en la solicitud:", error);
        }
    });
</script>
</body>
</html>
