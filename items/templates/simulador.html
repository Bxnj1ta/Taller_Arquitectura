<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Simulador de Créditos</title>
    <!-- Importar Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../static/simulador.css">
</head>
<body>
  <div class="container">
    <h2>💰 Simulador de Inversiones</h2>
    
    <form method="post" action="{% url 'logout' %}" style="text-align:right;">
      {% csrf_token %}
      <button type="submit" class="logout-btn">🚪 Cerrar sesión</button>
    </form>

    <form id="simuladorForm" method="post">
      {% csrf_token %}
      <label for="monto">Monto de inversión</label>
      <input type="number" id="monto" name="monto" min="1" required>

      <label for="meses">Plazo (meses)</label>
      <input type="number" id="meses" name="meses" min="1" required>

      <button type="submit">▶️ Simular</button>
    </form>
    <div id="resultado"></div>

    <!-- Canvas donde se pintarán los gráficos -->
    <canvas id="graficoSimulacion" width="400" height="200"></canvas>
    <canvas id="graficoConveniencia" width="400" height="200" style="margin-top:30px;"></canvas>

  </div>

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
            }
        }
        }
        return cookieValue;
    }

    document.getElementById("simuladorForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const monto = document.getElementById("monto").value;
        const meses = document.getElementById("meses").value;

        try {
        const response = await fetch("/api/simular/", {
            method: "POST",
            headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
            },
            body: JSON.stringify({ monto, meses })
        });

        const data = await response.json();
        console.log("Respuesta de la API:", data);

        if (data.error) {
            document.getElementById("resultado").innerHTML = `
            <p class="error">⚠️ ${data.error}</p>
            `;
            return;
        }

        let html = `
            <div style="padding:20px; border:1px solid #ddd; border-radius:12px; background:#f8f9fa;">
            <h3 style="color:#0077b6;">📊 Resultados de la Simulación</h3>
            <p><strong>Monto:</strong> $${Number(data.simulacion?.monto ?? 0).toLocaleString()}</p>
            <p><strong>Plazo:</strong> ${data.simulacion?.meses ?? "N/A"} meses</p>
            <hr>
        `;

        for (const [activo, valores] of Object.entries(data.resultados)) {
            html += `
            <div class="card">
                <h4>${activo}</h4>
                <p>💰 <strong>Esperado:</strong> $${valores.esperado.toLocaleString()}</p>
                <p>📈 <strong>Mejor caso:</strong> $${valores.mejor.toLocaleString()}</p>
                <p>📉 <strong>Peor caso:</strong> $${valores.peor.toLocaleString()}</p>
                <hr>
                <p><strong>🔎 Recomendación:</strong> ${valores.recomendacion}</p>
            </div>
            `;
        }
        html += "</div>";
        document.getElementById("resultado").innerHTML = html;

        // 🎨 Gráfico con Chart.js
        const ctx = document.getElementById("graficoSimulacion").getContext("2d");
        const labels = Object.keys(data.resultados);
        const esperado = labels.map(a => data.resultados[a].esperado);
        const mejor = labels.map(a => data.resultados[a].mejor);
        const peor = labels.map(a => data.resultados[a].peor);

        if (window.miGrafico instanceof Chart) {
            window.miGrafico.destroy();
        }

        window.miGrafico = new Chart(ctx, {
            type: "bar",
            data: {
                labels: labels,
                datasets: [
                    {
                        label: "Esperado",
                        data: esperado,
                        backgroundColor: "rgba(54, 162, 235, 0.6)"
                    },
                    {
                        label: "Mejor Caso",
                        data: mejor,
                        backgroundColor: "rgba(75, 192, 192, 0.6)"
                    },
                    {
                        label: "Peor Caso",
                        data: peor,
                        backgroundColor: "rgba(255, 99, 132, 0.6)"
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: "top" },
                    title: { display: true, text: "Comparación de Escenarios de Inversión" }
                }
            }
        });
        // Extraemos la conveniencia relativa
        const conveniencia = labels.map(a => data.resultados[a].conveniencia);

        // 🎨 Gráfico de Conveniencia Relativa vs CDT
        const ctx2 = document.getElementById("graficoConveniencia").getContext("2d");

        // Destruir el gráfico solo si existe y es instancia de Chart
        if (window.graficoConveniencia instanceof Chart) {
            window.graficoConveniencia.destroy();
        }

        window.graficoConveniencia = new Chart(ctx2, {
            type: "bar",
            data: {
                labels: labels,
                datasets: [
                    {
                        label: "Conveniencia vs CDT (%)",
                        data: conveniencia,
                        backgroundColor: "rgba(153, 102, 255, 0.6)"
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: "Conveniencia Relativa frente al CDT" }
                },
                scales: {
                    y: {
                        title: { display: true, text: "% sobre el CDT" },
                        ticks: {
                            callback: function(value) {
                                return value + "%";
                            }
                        }
                    }
                }
            }
        });


    } catch (error) {
        console.error("Error en la solicitud:", error);
        document.getElementById("resultado").innerHTML = `
            <p class="error">❌ Ocurrió un error al procesar la simulación.</p>
        `;
    }
  });
</script>
</body>
</html>
