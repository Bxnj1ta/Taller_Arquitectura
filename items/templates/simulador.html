<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Simulador de Créditos</title>
  {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">

</head>
<body>
  <div class="container">
    <h2>Simulador de Créditos</h2>
    <form id="simuladorForm" method="post">
        {% csrf_token %}
        <label for="monto">Monto</label>
        <input type="number" id="monto" name="monto" required>

        <label for="meses">Meses</label>
        <input type="number" id="meses" name="meses" required>

        <button type="submit">Simular</button>
    </form>

    <div id="resultado"></div>
  </div>

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.getElementById("simuladorForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const monto = document.getElementById("monto").value;
        const meses = document.getElementById("meses").value;

        try {
            const response = await fetch("/api/simular/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken") // 🔑 token CSRF
                },
                body: JSON.stringify({ monto, meses })
            });

            const data = await response.json();
            document.getElementById("resultado").innerText = JSON.stringify(data, null, 2);
        } catch (error) {
            console.error("Error en la solicitud:", error);
        }
    });
</script>


</body>
</html>
